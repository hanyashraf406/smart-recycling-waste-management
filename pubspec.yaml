name: trash_to_cash
description: A Flutter application for recycling management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  cloud_functions: ^4.6.0

  # UI & Utilities
  mobile_scanner: ^4.0.1
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  provider: ^6.1.1
  image_picker: ^1.0.5
  shared_preferences: ^2.2.2
  path: ^1.9.0
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.2.0
  flutter_svg: ^2.0.9
  http: ^1.2.0

  # Map & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  location: ^5.0.0
  permission_handler: ^11.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.0
  firebase_auth_mocks: ^0.13.0
  fake_cloud_firestore: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/trash.png
    - assets/images/onboarding1.png
    - assets/images/onboarding2.png
    - assets/images/onboarding3.png
    - assets/images/user_role.png
    - assets/images/employ_role.png
    - assets/images/plastic_small.png
    - assets/images/plastic_medium.png
    - assets/images/plastic_large.png
    - assets/images/can_small.png
    - assets/images/can_medium.png
    - assets/images/can_large.png
    - assets/images/glass_small.png
    - assets/images/glass_medium.png
    - assets/images/glass_large.png
    - assets/icons/home.svg
    - assets/icons/map.svg
    - assets/icons/profile.svg
    - assets/icons/qr.svg
    - assets/icons/categories.svg