<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trash To Cash | Admin Login</title>
<link rel="stylesheet" href="auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="brand-panel">
      <div class="brand-copy">
        <div class="brand-mark">
          <img src="homedashboard/assets/trash.svg" alt="TRASH TO CASH" style="width: 200px; height: auto;">
        </div>

        <h1>Welcome back, Admin</h1>
        <p>
          Log in with your admin credentials. Access is based on your role and warehouse.
        </p>
      </div>

      <div class="feature-row">
        <div class="feature-chip">Admin & Super Admin</div>
        <div class="feature-chip">Warehouse Access</div>
        <div class="feature-chip">Secure login</div>
      </div>
    </section>

    <section class="auth-card-wrap">
      <div class="auth-card">
        <div class="brand-mark auth-brand-mark">
          <img src="homedashboard/assets/trash.svg" alt="TRASH TO CASH" style="width: 180px; height: auto;">
        </div>

        <h2>Admin Log In</h2>
        <p>Use your admin or super admin account to continue.</p>

        <form id="adminLoginForm" class="auth-form" novalidate>
          <div class="field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="admin@greenbin.com" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Your password" autocomplete="current-password" required>
          </div>

          <button class="primary-action" type="submit">Log In</button>
        </form>

        <p id="authMessage" class="auth-message"></p>

        <div class="auth-footer">
          <span>Need an account?</span>
          <a href="./signup.html">Sign Up</a>
          <span style="margin: 0 8px;">|</span>
          <a href="./super-admin-signup.html">Super Admin</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyD-NDO4JdZCvyzWVCW2-6vFJqFICofqT7k",
        authDomain: "cach-6ebd3.firebaseapp.com",
        projectId: "cach-6ebd3",
        storageBucket: "cach-6ebd3.firebasestorage.app",
        messagingSenderId: "379255642460",
        appId: "1:379255642460:web:72de61f8c27d2b09bc0199",
        measurementId: "G-G3GBEEC83E"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const messageEl = document.getElementById('authMessage');
      
      if (!email || !password) {
        messageEl.textContent = 'Please enter email and password.';
        messageEl.style.color = '#ef4444';
        return;
      }
      
      messageEl.textContent = 'Logging in...';
      messageEl.style.color = '#3b82f6';
      
      try {
        // ✅ البحث في super_admins
        const superAdminDoc = await getDoc(doc(db, 'super_admins', email));
        
        if (superAdminDoc.exists()) {
          const superAdminData = superAdminDoc.data();
          
          if (superAdminData.password === password && superAdminData.isActive === true) {
            localStorage.setItem('adminUser', JSON.stringify({
              email: superAdminData.email,
              role: 'super_admin',
              warehouseId: 'all',
              warehouseName: 'All Warehouses',
              isAdmin: true
            }));
            
            messageEl.textContent = 'Login successful! Redirecting...';
            messageEl.style.color = '#10b981';
            
            setTimeout(() => {
              window.location.href = './homedashboard/homedashboard/index.html';
            }, 1000);
            return;
          }
        }
        
        // ✅ البحث في admins
        const adminDoc = await getDoc(doc(db, 'admins', email));
        
        if (adminDoc.exists()) {
          const adminData = adminDoc.data();
          
          if (adminData.password === password && adminData.isActive === true) {
            localStorage.setItem('adminUser', JSON.stringify({
              email: adminData.email,
              role: 'admin',
              warehouseId: adminData.warehouseId,
              warehouseName: adminData.warehouseName,
              isAdmin: true
            }));
            
            messageEl.textContent = 'Login successful! Redirecting...';
            messageEl.style.color = '#10b981';
            
            setTimeout(() => {
              window.location.href = './homedashboard/homedashboard/index.html';
            }, 1000);
            return;
          }
        }
        
        messageEl.textContent = 'Invalid email or password.';
        messageEl.style.color = '#ef4444';
        
      } catch (error) {
        console.error('Login error:', error);
        messageEl.textContent = 'Login failed: ' + error.message;
        messageEl.style.color = '#ef4444';
      }
    });
  </script>
</body>
</html>
