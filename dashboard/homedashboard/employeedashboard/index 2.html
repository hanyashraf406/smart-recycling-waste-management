<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash To Cash - Employee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../dashboard-base.css">
    <style>
        :root {
            --primary-green: #00C76A;
            --danger-red: #ff4d4f;
            --warning-orange: #ff9f43;
            --bg-light: #F5F7FA;
            --text-dark: #1A1A2E;
            --text-gray: #8A8A98;
            --border-color: #E8ECF0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
            width: 100%;
            max-width: 100%;
        }

        .sidebar {
            width: 280px;
            background: #FFFFFF;
            padding: 24px 16px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            padding-left: 8px;
        }

        .logo img {
            width: 161px;
            height: 78px;
            object-fit: contain;
        }

        .logo h2, .logo .text {
            display: none;
        }

        .admin-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            padding-left: 8px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .menu-item img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .menu-item .icon-emoji {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .menu-item:hover {
            background: #F0F2F5;
        }

        .menu-item.active {
            background: var(--primary-green);
            color: white;
        }

        .menu-item.active img {
            filter: brightness(0) saturate(100%) invert(100%);
        }

        .main-content {
            flex: 1;
            padding: 30px 35px;
            overflow-x: hidden;
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            padding: 10px 35px 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            outline: none;
            width: 300px;
            font-size: 14px;
        }

        .search-container i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .btn-delete {
            background-color: var(--danger-red);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: #d32f2f;
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background-color: #00b05a;
        }

        .btn-info {
            background-color: #1976D2;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-info:hover {
            background-color: #1565C0;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .summary-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
        }

        .summary-card span {
            display: block;
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .summary-card strong {
            font-size: 36px;
            color: var(--text-dark);
            font-weight: 700;
        }

        /* ========== Secret Code Section ========== */
        .secret-code-section {
            background: #fff;
            border: 2px solid var(--primary-green);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .secret-code-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .secret-code-info .code-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-green);
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
        }

        .secret-code-info .code-last-update {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 4px;
        }

        .secret-code-actions {
            display: flex;
            gap: 8px;
        }

        /* ========== Modal ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: white;
            padding: 28px;
            border-radius: 18px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-box h3 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .modal-box .modal-info {
            color: var(--text-gray);
            margin-bottom: 16px;
            font-size: 14px;
        }

        .modal-box .form-group {
            margin-bottom: 14px;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #425544;
            margin-bottom: 6px;
        }

        .modal-box .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            text-align: center;
            outline: none;
            letter-spacing: 3px;
        }

        .modal-box .form-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(0, 199, 106, 0.12);
        }

        .modal-box .form-group input[readonly] {
            background: #F5F7FA;
            color: var(--text-dark);
            font-weight: bold;
            letter-spacing: 6px;
        }

        .modal-box .modal-note {
            font-size: 11px;
            color: var(--text-gray);
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-actions .btn-cancel {
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #F0F2F5;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .modal-actions .btn-cancel:hover {
            background: #E8ECF0;
        }

        .modal-actions .btn-save {
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: var(--primary-green);
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .modal-actions .btn-save:hover {
            background: #00b05a;
        }

        /* ========== Toast ========== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .toast.success { background: #00A85A; }
        .toast.error { background: #D32F2F; }
        .toast.info { background: #1976D2; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .table-container {
            background-color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid #F0F2F5;
            font-size: 14px;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--text-gray);
            font-size: 13px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.selected-row {
            background-color: rgba(0, 199, 106, 0.05);
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .status-shift { background-color: #E6F7EE; color: #00A85A; }
        .status-absent { background-color: #FFE8E8; color: #D32F2F; }
        .status-break { background-color: #FFF3E0; color: #E65100; }
        .status-pending { background-color: #FFF8E1; color: #F57F17; }

        .status-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            background: white;
            cursor: pointer;
        }

        .row-action-btn {
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 4px;
        }

        .row-action-btn.approve {
            background: #E6F7EE;
            color: #00A85A;
        }

        .row-action-btn.approve:hover {
            background: #c8f0d8;
        }

        .row-action-btn.reject {
            background: #FFE8E8;
            color: #D32F2F;
        }

        .row-action-btn.reject:hover {
            background: #ffd0d0;
        }

        .empty-state {
            text-align: center;
            color: var(--text-gray);
            padding: 40px;
            font-size: 14px;
        }

        /* ========== Warehouse Select (for Super Admin) ========== */
        .wh-select {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--primary-green);
            font-size: 14px;
            background: white;
            cursor: pointer;
            min-width: 180px;
        }

        @media (max-width: 1100px) {
            body { overflow: auto; height: auto; }
            .main-content { padding: 24px; }
            .secret-code-section { flex-direction: column; align-items: flex-start; }
        }

        @media (max-width: 720px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .sidebar-nav, .nav-menu { flex-direction: row; flex-wrap: wrap; }
            .main-content { padding: 18px; }
            .summary-cards { grid-template-columns: 1fr; }
            .secret-code-actions { flex-direction: column; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <aside class="sidebar">
        <div class="sidebar-nav">
            <div class="logo">
                <img src="../assets/trash.svg" alt="TRASH TO CASH">
            </div>
       
            <div class="admin-title">Admin</div>
            
            <div class="nav-menu">
                <a href="../homedashboard/index.html" class="menu-item">
                    <img src="../assets/home.svg" alt="Home"> Home
                </a>
                <a href="../reportdashboard/index.html" class="menu-item">
                    <img src="../assets/report.svg" alt="Report"> Report
                </a>
                <a href="../employeedashboard/index 2.html" class="menu-item active">
                    <img src="../assets/employe.svg" alt="Employee"> Employee
                </a>
                <a href="../reviewsdashboard/index.html" class="menu-item">
                    <img src="../assets/review.svg" alt="Reviews"> Reviews
                </a>
                <a href="../warehousedashboard/index.html" class="menu-item">
                    <img src="../assets/warehouse.svg" alt="Warehouse RP"> Warehouse RP
                </a>
                <a href="../materialsdashboard/index.html" class="menu-item">
                    <img src="../assets/matierial.svg" alt="Materials"> Materials
                </a>
                <a href="../../login.html" class="menu-item" data-sign-out style="margin-top: auto;">
                    <span class="icon-emoji">🚪</span> Sign Out
                </a>
            </div>
        </div>
    </aside>

    <main class="main-content">
        
        <!-- ==================== SECRET CODE SECTION ==================== -->
        <div class="secret-code-section" id="secretCodeSection">
            <div class="secret-code-info">
                <h3>🔑 Warehouse Secret Code</h3>
                <div class="code-display" id="codeDisplay">••••••</div>
                <div class="code-last-update" id="codeLastUpdate"></div>
            </div>
            <div class="secret-code-actions">
                <select class="wh-select" id="warehouseSelect" style="display:none;"></select>
                <button class="btn-info" id="toggleCodeBtn">
                    <i class="fa-regular fa-eye"></i> Show Code
                </button>
                <button class="btn-primary" id="changeCodeBtn">
                    <i class="fa-solid fa-key"></i> Change Code
                </button>
            </div>
        </div>

        <div class="toolbar">
            <button class="btn-delete" id="deleteSelectedBtn">
                <i class="fa-regular fa-trash-can"></i> Delete Selected
            </button>
            <div class="search-container">
                <input type="text" id="employeeSearch" placeholder="Search by name, email, or ID">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>

        <div class="summary-cards">
            <div class="summary-card">
                <span>Total Employees</span>
                <strong id="totalEmployees">0</strong>
            </div>
            <div class="summary-card">
                <span>Shift</span>
                <strong id="shiftEmployees">0</strong>
            </div>
            <div class="summary-card">
                <span>Absent</span>
                <strong id="absentEmployees">0</strong>
            </div>
            <div class="summary-card">
                <span>Break</span>
                <strong id="breakEmployees">0</strong>
            </div>
        </div>

        <div class="table-container">
            <table id="employeeTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Warehouse</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

    </main>
</div>

<!-- ==================== CHANGE SECRET CODE MODAL ==================== -->
<div class="modal-overlay" id="codeModal">
    <div class="modal-box">
        <h3>🔑 Change Secret Code</h3>
        <p class="modal-info" id="codeModalWarehouse"></p>
        
        <div class="form-group">
            <label>Current Code</label>
            <input type="text" id="currentCodeInput" readonly>
        </div>
        
        <div class="form-group">
            <label>New Secret Code</label>
            <input type="password" id="newSecretCode" placeholder="Enter new code (min 4 digits)">
        </div>
        
        <div class="form-group">
            <label>Confirm New Code</label>
            <input type="password" id="confirmSecretCode" placeholder="Confirm new code">
        </div>

        <p class="modal-note">
            ⚠️ This code is required for new employees to register under this warehouse.
        </p>

        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeCodeModal()">Cancel</button>
            <button class="btn-save" id="saveCodeBtn">Save New Code</button>
        </div>
    </div>
</div>
<script type="module" src="employee.js"></script>
</body>
</html>
